modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="CtrlEm Minecraft Bridge"
authors="CtrlEm (community source port)"
description='''
Client-side CtrlEm desktop bridge, command permissions, F8 settings and image overlay.
NeoForge 1.21.1 port based on the supplied decompiled CtrlEm sources.
'''
# Client-only: don't flag servers that lack the mod as incompatible.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
