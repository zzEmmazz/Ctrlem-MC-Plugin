# ForgeGradle decompiles Minecraft on the first build and needs the memory.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Gradle 8.8 runs on Java 17-22. The mod itself is compiled for Java 21.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.264
neo_version_range=[21.1.0,21.2)
loader_version_range=[4,)

mod_id=ctrlem
mod_name=CtrlEm
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.ctrlem.mcbridge
