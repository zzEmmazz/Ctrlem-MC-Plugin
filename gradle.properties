# ForgeGradle decompiles Minecraft on the first build and wants room to do it.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
# No parallel execution, configuration cache or build cache here: ForgeGradle 5 supports none of
# them, unlike the NeoForge project next door.

# This build runs on Java 17 and nothing newer. Gradle 7.5.1 — the newest ForgeGradle 5 works
# with — refuses to start on Java 19+, so the usual JAVA_HOME (Java 21/23/25) will not do.
# Either launch with JAVA_HOME pointing at a JDK 17, or uncomment this and point it at one:
#org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.13.11-hotspot

# Environment Properties
# Forge versions for 1.18.2 are listed at https://files.minecraftforge.net/net/minecraftforge/forge/
minecraft_version=1.18.2
minecraft_version_range=[1.18.2,1.19)
# The Forge version this is compiled against.
forge_version=40.3.12
# The minimum Forge the mod declares it needs, kept separate from the version it is compiled
# against so bumping the latter does not silently lock out players on older builds.
forge_version_range=[40,)
# FML's own loader version, which for 1.18.2 tracks the Forge major version.
loader_version_range=[40,)

## Mod Properties

# Must match the String constant in CtrlEmMod, and the mod id used by the NeoForge build.
mod_id=ctrlem
mod_name=CtrlEm
mod_license=All Rights Reserved
# Kept in step with the NeoForge build: the same mod, for an older game.
mod_version=1.0.0
mod_group_id=com.ctrlem.mcbridge
