plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ctrlem-forge-1.20.1'
}

// Minecraft 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Mojang's official names, the same names the sources use.
    // Mojang mapping licence: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('jar', Jar).configure {
    // mods.toml reads the mod version from Implementation-Version (${file.jarVersion}).
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'CtrlEm',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'CtrlEm',
        ])
    }
    from('LICENSE') {
        rename { "LICENSE_ctrlem" }
    }
    // Remaps the jar from Mojang names to the SRG names a real Forge install runs on.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
