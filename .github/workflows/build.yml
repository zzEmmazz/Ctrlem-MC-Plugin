# Builds every push and pull request. Pushing a tag like forge-1.20.1-v1.0.1
# also publishes the jar as a GitHub release.
name: build
on:
  push:
    branches: [forge-1.20.1]
    tags: ['forge-1.20.1-v*']
  pull_request:
    branches: [forge-1.20.1]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: ctrlem-forge-1.20.1
          path: build/libs/*.jar
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
